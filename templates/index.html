<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BP Average Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2d3748;
    }
    header p {
      color: #718096;
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px;
      width: 100%;
      max-width: 560px;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: #4299e1;
      background: #ebf8ff;
    }
    #drop-zone svg {
      width: 48px;
      height: 48px;
      color: #a0aec0;
      margin-bottom: 12px;
    }
    #drop-zone p {
      color: #718096;
      font-size: 0.9rem;
    }
    #drop-zone strong {
      color: #4299e1;
    }
    #file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    /* Camera button */
    .camera-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      padding: 11px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      font-size: 0.9rem;
      color: #4a5568;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .camera-btn:hover { background: #f7fafc; border-color: #cbd5e0; }
    #camera-input { display: none; }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 20px;
      text-align: center;
      position: relative;
    }
    #preview-wrap img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      object-fit: contain;
    }
    #change-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Analyse button */
    #analyse-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }
    #analyse-btn:hover:not(:disabled) { background: #2b6cb0; }
    #analyse-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #results {
      display: none;
      margin-top: 28px;
    }
    .result-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a0aec0;
      margin-bottom: 12px;
    }

    /* Average box */
    .avg-box {
      border-radius: 12px;
      padding: 22px 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .avg-box.green  { background: #f0fff4; border: 1.5px solid #68d391; }
    .avg-box.yellow { background: #fffff0; border: 1.5px solid #f6e05e; }
    .avg-box.orange { background: #fffaf0; border: 1.5px solid #f6ad55; }
    .avg-box.red    { background: #fff5f5; border: 1.5px solid #fc8181; }

    .avg-reading {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: #2d3748;
      letter-spacing: -1px;
    }
    .avg-label {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 4px;
    }
    .category-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .green  .category-badge { background: #c6f6d5; color: #276749; }
    .yellow .category-badge { background: #fefcbf; color: #744210; }
    .orange .category-badge { background: #feebc8; color: #7b341e; }
    .red    .category-badge { background: #fed7d7; color: #742a2a; }

    /* Readings table */
    .readings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .readings-table th {
      background: #f7fafc;
      color: #718096;
      font-weight: 600;
      text-align: center;
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .readings-table td {
      padding: 8px 12px;
      text-align: center;
      border-bottom: 1px solid #f0f4f8;
      color: #2d3748;
    }
    .readings-table tr:last-child td { border-bottom: none; }

    /* Notes */
    .notes-box {
      background: #f7fafc;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #718096;
      margin-top: 16px;
    }

    /* Error */
    .error-box {
      background: #fff5f5;
      border: 1.5px solid #fc8181;
      border-radius: 10px;
      padding: 14px 16px;
      color: #c53030;
      font-size: 0.88rem;
      margin-top: 20px;
      display: none;
    }

    @media (max-width: 400px) {
      .avg-reading { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>BP Average Calculator</h1>
  <p>Upload a photo of blood pressure readings to get the average instantly</p>
</header>

<div class="card">
  <div id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
    </svg>
    <p><strong>Click to upload</strong> or drag & drop a photo</p>
    <p style="margin-top:4px;font-size:0.8rem;">JPG, PNG, WEBP supported</p>
  </div>

  <button class="camera-btn" id="camera-btn" onclick="document.getElementById('camera-input').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
    </svg>
    Take a photo
  </button>
  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <div id="preview-wrap">
    <img id="preview-img" src="" alt="Preview">
    <button id="change-btn" onclick="resetUpload()">Change</button>
  </div>

  <button id="analyse-btn" onclick="analyseImage()">Analyse readings</button>

  <div class="error-box" id="error-box"></div>

  <div id="results">
    <div class="result-header">Average Blood Pressure</div>
    <div class="avg-box" id="avg-box">
      <div class="avg-reading" id="avg-reading">—</div>
      <div class="avg-label" id="avg-label"></div>
      <span class="category-badge" id="category-badge"></span>
    </div>

    <div class="result-header" id="readings-header"></div>
    <table class="readings-table" id="readings-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Systolic</th>
          <th>Diastolic</th>
          <th>Reading</th>
        </tr>
      </thead>
      <tbody id="readings-body"></tbody>
    </table>

    <div class="notes-box" id="notes-box" style="display:none"></div>
  </div>
</div>

<script>
  let selectedFile = null;

  function setFile(file) {
    if (!file) return;
    selectedFile = file;
    const url = URL.createObjectURL(file);
    document.getElementById('preview-img').src = url;
    document.getElementById('preview-wrap').style.display = 'block';
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('camera-btn').style.display = 'none';
    document.getElementById('analyse-btn').style.display = 'block';
    document.getElementById('results').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
  }

  function resetUpload() {
    selectedFile = null;
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('drop-zone').style.display = 'block';
    document.getElementById('camera-btn').style.display = 'flex';
    document.getElementById('analyse-btn').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('file-input').value = '';
    document.getElementById('camera-input').value = '';
  }

  document.getElementById('file-input').addEventListener('change', e => {
    setFile(e.target.files[0]);
  });
  document.getElementById('camera-input').addEventListener('change', e => {
    setFile(e.target.files[0]);
  });

  // Drag and drop
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) setFile(file);
  });

  async function analyseImage() {
    if (!selectedFile) return;

    const btn = document.getElementById('analyse-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Analysing…';
    document.getElementById('error-box').style.display = 'none';
    document.getElementById('results').style.display = 'none';

    try {
      const formData = new FormData();
      formData.append('image', selectedFile);

      const resp = await fetch('/analyse', { method: 'POST', body: formData });
      const data = await resp.json();

      if (!resp.ok) {
        throw new Error(data.error || 'Something went wrong');
      }

      displayResults(data);
    } catch (err) {
      const box = document.getElementById('error-box');
      box.textContent = err.message || 'Failed to analyse image. Please try again.';
      box.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Analyse readings';
    }
  }

  function displayResults(data) {
    const { readings, averages, notes } = data;

    if (!averages || readings.length === 0) {
      const box = document.getElementById('error-box');
      box.textContent = 'No blood pressure readings were found in this image. Please try a clearer photo.';
      box.style.display = 'block';
      return;
    }

    // Average box
    const avgBox = document.getElementById('avg-box');
    avgBox.className = `avg-box ${averages.category.color}`;
    document.getElementById('avg-reading').textContent =
      `${averages.avg_systolic}/${averages.avg_diastolic}`;
    document.getElementById('avg-label').textContent =
      `Average of ${averages.count} reading${averages.count !== 1 ? 's' : ''} · mmHg`;
    const badge = document.getElementById('category-badge');
    badge.textContent = averages.category.label;

    // Readings table
    document.getElementById('readings-header').textContent =
      `Individual Readings (${readings.length})`;
    const tbody = document.getElementById('readings-body');
    tbody.innerHTML = '';
    readings.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:#a0aec0">${i + 1}</td>
        <td>${r.systolic}</td>
        <td>${r.diastolic}</td>
        <td style="font-weight:600">${r.systolic}/${r.diastolic}</td>`;
      tbody.appendChild(tr);
    });

    // Notes
    const notesBox = document.getElementById('notes-box');
    if (notes && notes.trim()) {
      notesBox.textContent = notes;
      notesBox.style.display = 'block';
    } else {
      notesBox.style.display = 'none';
    }

    document.getElementById('results').style.display = 'block';
  }
</script>
</body>
</html>
