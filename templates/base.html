<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hassan — Developer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAFAF8;
      --surface: #FFFFFF;
      --text: #1C1917;
      --text-muted: #78716C;
      --text-light: #A8A29E;
      --accent: #C2694F;
      --accent-dark: #A85540;
      --accent-light: #FDF2EF;
      --border: #E7E5E4;
      --border-light: #F5F5F4;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.05);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 20px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --nav-h: 68px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(250,250,248,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1120px) / 2));
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .nav-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      transition: color 0.2s, background 0.2s;
    }
    .nav-links a:hover { color: var(--text); background: var(--border-light); }
    .nav-links a.active { color: var(--text); background: var(--border-light); }

    .nav-cta {
      background: var(--text) !important;
      color: white !important;
      font-weight: 600 !important;
      transition: background 0.2s, transform 0.1s !important;
    }
    .nav-cta:hover { background: #292524 !important; transform: translateY(-1px); }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    .nav-toggle span {
      width: 22px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.25s;
      display: block;
    }

    /* ── MAIN ── */
    main { flex: 1; padding-top: var(--nav-h); }

    /* ── CONTAINER ── */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 24px;
    }
    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-text { font-size: 0.875rem; color: var(--text-muted); }
    .footer-links { display: flex; gap: 20px; }
    .footer-links a {
      font-size: 0.875rem;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--accent); }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 72px 0 52px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 64px;
    }
    .page-header .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    .page-header p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.65;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      border: none;
      font-family: var(--font);
      line-height: 1;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(194,105,79,0.28);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--text-muted);
      transform: translateY(-1px);
    }

    /* ── FORMS ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 11px 15px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
      width: 100%;
      -webkit-appearance: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(194,105,79,0.1);
    }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    /* ── SUCCESS BOX ── */
    .success-box {
      background: #F0FDF4;
      border: 1.5px solid #86EFAC;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      color: #166534;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-up-d1 { animation-delay: 0.08s; }
    .fade-up-d2 { animation-delay: 0.16s; }
    .fade-up-d3 { animation-delay: 0.24s; }
    .fade-up-d4 { animation-delay: 0.32s; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-links.open {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        position: fixed;
        top: var(--nav-h);
        left: 0; right: 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px 16px;
        box-shadow: var(--shadow);
      }
      .nav-links.open a { display: block; padding: 11px 14px; font-size: 1rem; }
      .nav-toggle { display: flex; }
      .form-row { grid-template-columns: 1fr; }
      .page-header { padding: 48px 0 40px; margin-bottom: 48px; }
      .page-header h1 { font-size: 2rem; }
      .footer-inner { flex-direction: column; align-items: center; text-align: center; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">Hassan<span>.</span></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="/" {% if active_page == 'home' %}class="active"{% endif %}>Home</a></li>
      <li><a href="/projects" {% if active_page == 'projects' %}class="active"{% endif %}>Projects</a></li>
      <li><a href="/feedback" {% if active_page == 'feedback' %}class="active"{% endif %}>Feedback</a></li>
      <li><a href="/contact" class="nav-cta {% if active_page == 'contact' %}active{% endif %}">Contact</a></li>
    </ul>
    <div class="nav-toggle" id="nav-toggle" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div class="footer-inner">
      <p class="footer-text">© 2026 Hassan. Built with care.</p>
      <div class="footer-links">
        <a href="https://github.com/hassan93k" target="_blank" rel="noopener">GitHub</a>
        <a href="/projects">Projects</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    function toggleNav() {
      const links = document.getElementById('nav-links');
      links.classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      const nav = document.querySelector('nav');
      if (!nav.contains(e.target)) {
        document.getElementById('nav-links').classList.remove('open');
      }
    });
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
